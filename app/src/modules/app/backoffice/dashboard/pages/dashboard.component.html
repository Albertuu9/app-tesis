    <div class="bg-grisAzulado min-h-screen flex flex-col md:flex-row p-6 gap-6 bg-cover bg-center bg-fixed" 
    style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/6e/Bonampak_mural._Room_1._Musicians_and_dancers.jpg'); background-blend-mode: overlay; position: relative;">
      
      <te-form-ceramics class="md:w-4/12" [ceramic]="ceramic" (getCeramicData)="getCeramicData($event)"></te-form-ceramics>

      <div *ngIf="ceramics?.length" class="md:w-8/12 bg-white shadow-lg rounded-lg p-6 w-full h-[90vh] overflow-y-auto border-4 border-turquesaMaya">
        <div class="title-wrapper mb-4">
            <span class="custom-title primary-color">Listado de cerámicas</span>
            <button type="button" class="action-btn" (click)="goToAddCeramic()">
                Nueva cerámica
            </button>
        </div>
        <div class="space-y-4">
            <te-list-ceramics-generic [ceramics]="ceramics" [type]="'edition'" (deleteCeramic)="deleteCeramic($event)" (editCeramic)="editCeramic($event)"></te-list-ceramics-generic>
        </div>
      </div> 
      <div class="modal fade" id="deleteModal" #deleteModal>
        <te-generic-modal [data]="deleteModalData" (sendData)="getDeleteData($event)"></te-generic-modal>
      </div>
      <te-generic-snackbar [genericData]="snackbarData"></te-generic-snackbar>
    </div>
